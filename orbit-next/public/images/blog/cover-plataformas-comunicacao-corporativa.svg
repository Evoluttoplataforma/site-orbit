<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Plataformas para alinhar setores: como escolher comunicação corporativa em 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#ffba1a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffba1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffba1a"/>
      <stop offset="1" stop-color="#ff8c00"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(80, 100)">
    <rect rx="22" ry="22" width="140" height="44" fill="#ffba1a" fill-opacity="0.12" stroke="#ffba1a" stroke-opacity="0.35"/>
    <text x="70" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffba1a" text-anchor="middle" letter-spacing="2">ESTRATÉGIA</text>
  </g>
  <text x="80" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">Plataformas para</text>
  <text x="80" y="306" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="56" font-weight="800" fill="url(#gold)" letter-spacing="-1">alinhar setores: como</text>
  <text x="80" y="372" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">escolher comunicação</text>
  <text x="80" y="438" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">corporativa…</text>
  <g transform="translate(80, 552)">
    <circle cx="14" cy="14" r="14" fill="url(#gold)"/>
    <circle cx="14" cy="14" r="6" fill="#0D1117"/>
    <text x="42" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Orbit Gestão</text>
  </g>
  <rect x="0" y="624" width="1200" height="6" fill="url(#gold)"/>
</svg>
